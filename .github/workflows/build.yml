name: build
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-tests/package-lock.json
      - name: Emoji font (screenshots show the buttons' symbols, not boxes)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-color-emoji
      - name: Install UI test tools
        working-directory: web-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: UI unit tests
        run: node --test web-tests/unit/*.test.mjs
      - name: UI tests (Playwright against devServer)
        working-directory: web-tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web-tests/playwright-report
            web-tests/test-results
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create data dir
        shell: pwsh
        env:
          TGB_TEST_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: New-Item -ItemType Directory -Force -Path "$env:TGB_TEST_LOCALAPPDATA\tmp" | Out-Null
      - name: Tests (all projects)
        shell: pwsh
        env:
          TGB_TEST_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: ./gradlew.bat test
      - name: TDLib probe without NativeTmp (Hebrew TEMP, evidence only)
        shell: pwsh
        env:
          TGB_TEST_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
          TGB_NATIVE_TMP_OFF: '1'
        run: |
          # Records whether the library itself can load its DLLs from a Hebrew java.io.tmpdir.
          # The result is printed, not asserted: the program never runs this way.
          $out = ./gradlew.bat :desktop:tdlibSmoke 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out -split "`n" | Select-String -Pattern 'TDLIB_|JAVA_TMPDIR|Exception|UnsatisfiedLink|Caused by' |
            Select-Object -First 20 | ForEach-Object { Write-Host "HEBREW_TMP_PROBE_LINE $($_.Line.Trim())" }
          Write-Host "HEBREW_TMP_PROBE exit=$code"
          exit 0
      - name: TDLib smoke
        shell: pwsh
        env:
          TGB_TEST_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: |
          # Same Hebrew LOCALAPPDATA and TEMP; the program must move java.io.tmpdir to ASCII by itself.
          $out = ./gradlew.bat :desktop:tdlibSmoke 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit $code }
          $line = ($out -split "`n" | Select-String -Pattern '^NATIVE_TMP ' | Select-Object -First 1).Line
          if (-not $line) { Write-Error "NATIVE_TMP not printed"; exit 1 }
          $dir = $line.Substring(11).Trim()
          if ($dir -eq 'default' -or $dir -match '[^\x20-\x7E]') { Write-Error "native tmp dir is not ASCII: $dir"; exit 1 }
          if (-not ($out -match 'NATIVE_TMP_RELAUNCH ')) { Write-Error "expected a relaunch with an ASCII TEMP"; exit 1 }
          Write-Host "NATIVE_TMP_OK $dir"
          $log = Get-ChildItem -Recurse -Path $env:TGB_TEST_LOCALAPPDATA -Filter tdlib.log
          if (-not $log) { Write-Error "tdlib.log not created under Hebrew LOCALAPPDATA"; exit 1 }
          $log | ForEach-Object { Write-Host "TDLIB_LOG $($_.FullName)" }
      - name: Engine smoke
        shell: pwsh
        env:
          TGB_TEST_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: |
          # The real DesktopApp with a dummy account: TDLib must start through the engine under a Hebrew path.
          $out = ./gradlew.bat :desktop:engineSmoke 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit $code }
          if (-not ($out -match 'ENGINE_OK ')) { Write-Error "ENGINE_OK not printed"; exit 1 }
          if (-not ($out -match 'NATIVE_TMP_RELAUNCH ')) { Write-Error "expected a relaunch with an ASCII TEMP"; exit 1 }
          $cfg = Get-ChildItem -Recurse -Path $env:TGB_TEST_LOCALAPPDATA -Filter config_v2.json
          if (-not $cfg) { Write-Error "config_v2.json not created under Hebrew LOCALAPPDATA"; exit 1 }
          $cfg | ForEach-Object { Write-Host "ENGINE_CONFIG $($_.FullName)" }
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: webview2
            task: WebView2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe runner (WiX, Inno Setup, WebView2 runtime)
        shell: pwsh
        run: |
          foreach ($t in 'candle','light','wix','iscc') {
            $found = where.exe $t 2>$null
            if ($found) { Write-Host "PROBE_TOOL $t => $found" } else { Write-Host "PROBE_TOOL $t => (not found)" }
          }
          Write-Host "PROBE_INNO_DEFAULT $(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')"
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { Write-Host "WEBVIEW2_RUNTIME preinstalled=yes version=$((Get-ItemProperty $key).pv)" }
          else { Write-Host "WEBVIEW2_RUNTIME preinstalled=no" }
          exit 0
      - name: Build installer
        shell: pwsh
        run: |
          ./gradlew.bat ":desktop:package${{ matrix.task }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer size
        shell: pwsh
        run: |
          $f = Get-Item "desktop/build/spike/${{ matrix.candidate }}/installer/TGBackup-Setup.exe"
          Write-Host ("INSTALLER_SIZE_MB ${{ matrix.candidate }} {0:N1}" -f ($f.Length / 1MB))
          $img = "desktop/build/spike/${{ matrix.candidate }}/image/TGBackup"
          $sum = (Get-ChildItem -Recurse -File $img | Measure-Object -Sum Length).Sum
          Write-Host ("APP_IMAGE_SIZE_MB ${{ matrix.candidate }} {0:N1}" -f ($sum / 1MB))
      - name: Silent install
        shell: pwsh
        run: |
          $dir = "${{ runner.temp }}\inst"
          $inst = "desktop/build/spike/${{ matrix.candidate }}/installer"
          $kind = (Get-Content "$inst/installer-kind.txt").Trim()
          Write-Host "INSTALLER_KIND $kind"
          if ($kind -eq 'wix') {
            # jpackage's exe wrapper forwards its arguments to msiexec.
            $instArgs = '/quiet','/norestart',"INSTALLDIR=`"$dir`"",'/l*v',"`"${{ runner.temp }}\msi-install.log`""
          } else {
            $instArgs = '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=`"$dir`""
          }
          $p = Start-Process -FilePath "$inst/TGBackup-Setup.exe" -ArgumentList $instArgs -Wait -PassThru
          Write-Host "INSTALL_EXIT $($p.ExitCode)"
          $msiLog = "${{ runner.temp }}\msi-install.log"
          if (($p.ExitCode -ne 0 -or -not (Test-Path "$dir\TGBackup.exe")) -and (Test-Path $msiLog)) {
            Get-Content $msiLog -Tail 60 | Where-Object { $_ -match 'error|fail|INSTALLDIR|Return value 3' } | Write-Host
          }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (-not (Test-Path "$dir\TGBackup.exe")) { Write-Error "TGBackup.exe not installed"; exit 1 }
          Get-ChildItem "$dir\app" -Directory | ForEach-Object { Write-Host "APP_DIR $($_.FullName)" }
          Get-ChildItem -Recurse "$dir\app" -Filter *.dll | Select-Object -First 12 | ForEach-Object { Write-Host "NATIVE $($_.FullName)" }
      - name: Smoke (offline proxy) + screenshot
        shell: pwsh
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          TGB_FORCE_PROXY: 127.0.0.1:9
          TGB_HEB_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: |
          # Hebrew+space data dir for the installed program only (this step runs no Gradle).
          New-Item -ItemType Directory -Force -Path $env:TGB_HEB_LOCALAPPDATA | Out-Null
          $env:LOCALAPPDATA = $env:TGB_HEB_LOCALAPPDATA
          # A Hebrew TEMP as well, as for a Hebrew Windows user name: the program must restart itself
          # with an ASCII TEMP (NativeTmp) and still show the page.
          New-Item -ItemType Directory -Force -Path "$env:TGB_HEB_LOCALAPPDATA\tmp" | Out-Null
          $env:TEMP = "$env:TGB_HEB_LOCALAPPDATA\tmp"
          $env:TMP = "$env:TGB_HEB_LOCALAPPDATA\tmp"
          $shots = "${{ runner.temp }}\shots"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          # Window capture and display settings (P/Invoke). The screenshots are of the TGBackup window itself (by its
          # HWND), not of the screen: CopyFromScreen of the whole screen caught the runner's console window.
          # A compile failure only skips the screenshots and the resolution change, never the smoke checks.
          $winApi = $true
          try {
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class TgbWin {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)] public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr hdc, uint flags);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool EnumDisplaySettings(string dev, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            /** The visible top-level window titled exactly `title`, any process (NativeTmp restarts the program). */
            public static IntPtr FindByTitle(string title, out uint pid) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => {
                if (!IsWindowVisible(h)) return true;
                var sb = new StringBuilder(256);
                GetWindowText(h, sb, 256);
                if (sb.ToString() != title) return true;
                found = h;
                return false;
              }, IntPtr.Zero);
              pid = 0;
              if (found != IntPtr.Zero) GetWindowThreadProcessId(found, out pid);
              return found;
            }
          }
          '@
          } catch { $winApi = $false; Write-Host "WINAPI_FAIL $_" }
          # A bigger runner screen before the program starts (its window size and the split view depend on it).
          # Never fails the step: RESOLUTION_FAIL is printed and the smoke goes on.
          if (-not $winApi) { Write-Host "RESOLUTION_FAIL no WinAPI" }
          else { try {
            $dm = New-Object TgbWin+DEVMODE
            $dm.dmSize = [System.Runtime.InteropServices.Marshal]::SizeOf($dm)
            $modes = @()
            for ($i = 0; [TgbWin]::EnumDisplaySettings($null, $i, [ref]$dm); $i++) { $modes += "$($dm.dmPelsWidth)x$($dm.dmPelsHeight)" }
            Write-Host "DISPLAY_MODES $(($modes | Select-Object -Unique) -join ' ')"
            $null = [TgbWin]::EnumDisplaySettings($null, -1, [ref]$dm)
            Write-Host "RESOLUTION_BEFORE $($dm.dmPelsWidth)x$($dm.dmPelsHeight)"
            $dm.dmPelsWidth = 1920
            $dm.dmPelsHeight = 1080
            $dm.dmFields = 0x00080000 -bor 0x00100000
            $rc = [TgbWin]::ChangeDisplaySettings([ref]$dm, 0)
            $now = New-Object TgbWin+DEVMODE
            $now.dmSize = $dm.dmSize
            $null = [TgbWin]::EnumDisplaySettings($null, -1, [ref]$now)
            $size = "$($now.dmPelsWidth)x$($now.dmPelsHeight)"
            if ($rc -eq 0 -and $size -eq '1920x1080') { Write-Host "RESOLUTION_OK $size" }
            else { Write-Host "RESOLUTION_FAIL ChangeDisplaySettings=$rc now=$size" }
          } catch { Write-Host "RESOLUTION_FAIL $_" } }

          function Test-Black($bmp) {
            # WebView2 is sometimes not drawn by PrintWindow: then every sampled pixel is black.
            for ($x = 0; $x -lt 20; $x++) { for ($y = 0; $y -lt 20; $y++) {
              $c = $bmp.GetPixel([int](($bmp.Width - 1) * $x / 19), [int](($bmp.Height - 1) * $y / 19))
              if ($c.R -gt 8 -or $c.G -gt 8 -or $c.B -gt 8) { return $false }
            } }
            return $true
          }
          function Save-Window($h, $file, $label) {
            [TgbWin]::SetForegroundWindow($h) | Out-Null
            Start-Sleep -Milliseconds 500
            $r = New-Object TgbWin+RECT
            if (-not [TgbWin]::GetWindowRect($h, [ref]$r)) { Write-Host "SCREENSHOT_FAIL $label GetWindowRect"; return }
            $w = $r.Right - $r.Left
            $hh = $r.Bottom - $r.Top
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $hdc = $g.GetHdc()
            $ok = [TgbWin]::PrintWindow($h, $hdc, 2)  # PW_RENDERFULLCONTENT
            $g.ReleaseHdc($hdc)
            $method = 'PrintWindow'
            if (-not $ok -or (Test-Black $bmp)) {
              # Fallback: the window in front, then only its rectangle from the screen.
              [TgbWin]::SetForegroundWindow($h) | Out-Null
              Start-Sleep -Milliseconds 500
              $g.CopyFromScreen($r.Left, $r.Top, 0, 0, (New-Object System.Drawing.Size $w, $hh))
              $method = "CopyFromScreen (PrintWindow ok=$ok)"
            }
            $g.Dispose()
            $bmp.Save("$shots\$file", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "SCREENSHOT $label saved ${w}x${hh} at $($r.Left),$($r.Top) method=$method file=$file"
          }

          $out = "$shots\smoke-stdout.txt"
          $err = "$shots\smoke-stderr.txt"
          # Holds the loaded window long enough for the two screenshots (default 5 s).
          $env:TGB_SMOKE_HOLD_MS = '20000'
          $p = Start-Process -FilePath "${{ runner.temp }}\inst\TGBackup.exe" -ArgumentList '--smoke' `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $null = $p.Handle
          $deadline = (Get-Date).AddSeconds(90)
          $loaded = $false
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            if ((Test-Path $out) -and (Select-String -Path $out -Pattern 'PAGE_LOADED' -Quiet)) { $loaded = $true; break }
            Start-Sleep -Milliseconds 250
          }
          if ($loaded -and $winApi) {
            Start-Sleep -Milliseconds 1500
            try {
              # The window of the restarted process (NativeTmp), found by its title, not $p's.
              $h = [IntPtr]::Zero
              [uint32]$wpid = 0
              $until = (Get-Date).AddSeconds(10)
              while ($h -eq [IntPtr]::Zero -and (Get-Date) -lt $until) {
                $h = [TgbWin]::FindByTitle('TG Backup', [ref]$wpid)
                if ($h -eq [IntPtr]::Zero) { Start-Sleep -Milliseconds 250 }
              }
              if ($h -eq [IntPtr]::Zero) { Write-Host "SCREENSHOT_FAIL window 'TG Backup' not found" }
              else {
                $proc = Get-Process -Id $wpid -ErrorAction SilentlyContinue
                Write-Host "WINDOW_FOUND hwnd=$h pid=$wpid process=$($proc.ProcessName) launched_pid=$($p.Id)"
                [TgbWin]::ShowWindow($h, 5) | Out-Null  # SW_SHOW
                Save-Window $h "screenshot-${{ matrix.candidate }}.png" 'initial'
                [TgbWin]::ShowWindow($h, 3) | Out-Null  # SW_MAXIMIZE: from 1200 px the split view (jobs|log) shows
                Start-Sleep -Milliseconds 2500
                Save-Window $h "screenshot-${{ matrix.candidate }}-max.png" 'maximized'
              }
            } catch { Write-Host "SCREENSHOT_FAIL $_" }
          }
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Host "SMOKE_HUNG" }
          Write-Host "--- stdout"; Get-Content $out
          Write-Host "--- stderr"; Get-Content $err
          Write-Host "SMOKE_EXIT $($p.ExitCode)"
          if (-not (Select-String -Path $out -Pattern '^PAGE_LOADED' -Quiet)) { Write-Error "PAGE_LOADED not printed"; exit 1 }
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Select-String -Path $out -Pattern '^PAGE_FAIL' -Quiet) { Write-Error "PAGE_FAIL printed"; exit 1 }
          if (-not (Select-String -Path $out -Pattern '^API_OK' -Quiet)) { Write-Error "API_OK not printed"; exit 1 }
          if (-not (Select-String -Path $out -Pattern '^WINDOW_INSIDE yes' -Quiet)) {
            Write-Error "window is not fully inside the screen work area"; exit 1
          }
          if (-not (Select-String -Path $out -Pattern '^NATIVE_TMP_RELAUNCH ' -Quiet)) {
            Write-Error "TGBackup.exe did not restart with an ASCII TEMP"; exit 1
          }
          # --smoke runs on its own throw-away data dir next to the real one (never the user's data), reports the
          # WebView2 profile it used there, then removes the dir.
          $profileLine = (Select-String -Path $out -Pattern '^SMOKE_PROFILE entries=(\d+)' | Select-Object -First 1)
          if (-not $profileLine -or [int]$profileLine.Matches[0].Groups[1].Value -eq 0) {
            Write-Error "WebView2 profile missing or empty under the Hebrew smoke data dir"; exit 1
          }
          Write-Host "PROFILE $($profileLine.Line)"
          $smokeDir = Join-Path $env:TGB_HEB_LOCALAPPDATA "TGBackup-smoke"
          Write-Host "SMOKE_DIR_LEFT $(Test-Path $smokeDir) ($((Select-String -Path $out -Pattern '^SMOKE_CLEANED' | Select-Object -First 1).Line))"
          if (Test-Path (Join-Path $env:TGB_HEB_LOCALAPPDATA "TGBackup")) { Write-Error "--smoke touched the real data dir"; exit 1 }
      - name: Second launch hands off to the running one
        shell: pwsh
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          TGB_FORCE_PROXY: 127.0.0.1:9
        run: |
          # Both runs use the same smoke data dir. A stale instance.json (a crashed owner, nobody holds the lock) must
          # not block the first; the second, started while the first holds its window, must print
          # INSTANCE_HANDED_OFF (the first answered POST /internal/show) and exit 0, and the first must carry on.
          $env:LOCALAPPDATA = "${{ runner.temp }}\second-instance"
          $smokeDir = "$env:LOCALAPPDATA\TGBackup-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Set-Content -Path "$smokeDir\instance.json" -Value '{"port":9,"token":"stale"}' -Encoding ascii
          $shots = "${{ runner.temp }}\shots"
          New-Item -ItemType Directory -Force -Path $shots | Out-Null
          $exe = "${{ runner.temp }}\inst\TGBackup.exe"
          $out1 = "$shots\first-stdout.txt"; $err1 = "$shots\first-stderr.txt"
          $out2 = "$shots\second-stdout.txt"; $err2 = "$shots\second-stderr.txt"
          $env:TGB_SMOKE_HOLD_MS = '15000'
          $p1 = Start-Process -FilePath $exe -ArgumentList '--smoke' -RedirectStandardOutput $out1 -RedirectStandardError $err1 -PassThru
          $null = $p1.Handle
          $deadline = (Get-Date).AddSeconds(90)
          $loaded = $false
          while (-not $p1.HasExited -and (Get-Date) -lt $deadline) {
            if ((Test-Path $out1) -and (Select-String -Path $out1 -Pattern '^PAGE_LOADED' -Quiet)) { $loaded = $true; break }
            Start-Sleep -Milliseconds 250
          }
          $p2 = $null
          if ($loaded) {
            $p2 = Start-Process -FilePath $exe -ArgumentList '--smoke' -RedirectStandardOutput $out2 -RedirectStandardError $err2 -PassThru
            $null = $p2.Handle
            if (-not $p2.WaitForExit(60000)) { Stop-Process -Id $p2.Id -Force; Write-Host "SECOND_HUNG" }
          }
          if (-not $p1.WaitForExit(90000)) { Stop-Process -Id $p1.Id -Force; Write-Host "FIRST_HUNG" }
          Write-Host "--- first stdout"; Get-Content $out1
          Write-Host "--- first stderr"; Get-Content $err1
          Write-Host "FIRST_EXIT $($p1.ExitCode)"
          if (-not $loaded) { Write-Error "the first launch did not load its page (a stale instance.json must not block)"; exit 1 }
          Write-Host "--- second stdout"; Get-Content $out2
          Write-Host "--- second stderr"; Get-Content $err2
          Write-Host "SECOND_EXIT $($p2.ExitCode)"
          if (Select-String -Path $out1 -Pattern '^INSTANCE_' -Quiet) { Write-Error "the first launch saw another instance"; exit 1 }
          if (-not (Select-String -Path $out2 -Pattern '^INSTANCE_HANDED_OFF' -Quiet)) { Write-Error "INSTANCE_HANDED_OFF not printed"; exit 1 }
          if (Select-String -Path $out2 -Pattern '^PAGE_LOADED' -Quiet) { Write-Error "the second launch opened a window"; exit 1 }
          if ($p2.ExitCode -ne 0) { Write-Error "the second launch exited $($p2.ExitCode)"; exit 1 }
          if ($p1.ExitCode -ne 0) { Write-Error "the first launch exited $($p1.ExitCode) after the hand-off"; exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.candidate }}
          path: ${{ runner.temp }}\shots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-${{ matrix.candidate }}
          path: desktop/build/spike/${{ matrix.candidate }}/installer/TGBackup-Setup.exe
          if-no-files-found: warn
          compression-level: 0
