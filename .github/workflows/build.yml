name: build
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create data dir
        shell: pwsh
        env:
          TGB_TEST_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: New-Item -ItemType Directory -Force -Path "$env:TGB_TEST_LOCALAPPDATA\tmp" | Out-Null
      - name: Desktop tests
        shell: pwsh
        env:
          TGB_TEST_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: ./gradlew.bat :desktop:test
      - name: TDLib smoke
        shell: pwsh
        env:
          TGB_TEST_LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: ./gradlew.bat :desktop:tdlibSmoke
