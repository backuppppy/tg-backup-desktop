name: build
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Create data dir
        shell: bash
        env:
          LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: mkdir -p "$LOCALAPPDATA/tmp"
      - name: Desktop tests
        shell: bash
        env:
          LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
        run: ./gradlew :desktop:test
      - name: TDLib smoke
        shell: bash
        env:
          LOCALAPPDATA: ${{ runner.temp }}\תיקייה עם רווח
          TEMP: ${{ runner.temp }}\תיקייה עם רווח\tmp
          TMP: ${{ runner.temp }}\תיקייה עם רווח\tmp
        run: ./gradlew :desktop:tdlibSmoke
